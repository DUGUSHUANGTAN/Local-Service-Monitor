<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Service Monitor</title>
<script>window.__LSM_CSRF__ = "__CSRF_TOKEN__";</script>
<style>
/* ============ Themes: independently designed, not inverted ============ */
:root {
  --radius: 16px;
  --radius-sm: 12px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --dur: 180ms;
}
html[data-theme="light"] {
  --bg: #E8ECF1;
  --surface: #E8ECF1;
  --surface-2: #EDF0F4;
  --text: #27313D;
  --text-2: #687381;
  --shadow-dark: rgba(163, 174, 188, 0.52);
  --shadow-light: rgba(255, 255, 255, 0.85);
  --raised: -5px -5px 11px var(--shadow-light), 5px 5px 11px var(--shadow-dark);
  --raised-sm: -3px -3px 7px var(--shadow-light), 3px 3px 7px var(--shadow-dark);
  --pressed: inset -3px -3px 6px var(--shadow-light), inset 3px 3px 6px var(--shadow-dark);
  --inset: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
  --accent: #3E7BFA;
  --accent-soft: rgba(62, 123, 250, 0.14);
  --ok: #2FA36B;
  --warn: #D9A043;
  --danger: #D9615F;
  --line: rgba(39, 49, 61, 0.08);
  --scrim: rgba(120, 130, 145, 0.35);
}
html[data-theme="dark"] {
  --bg: #000000;
  --surface: #17191D;
  --surface-2: #202329;
  --text: #E7E9ED;
  --text-2: #9499A3;
  --shadow-dark: rgba(0, 0, 0, 0.85);
  --shadow-light: rgba(255, 255, 255, 0.045);
  --raised: -4px -4px 10px var(--shadow-light), 5px 5px 12px var(--shadow-dark);
  --raised-sm: -2px -2px 6px var(--shadow-light), 3px 3px 8px var(--shadow-dark);
  --pressed: inset -2px -2px 5px var(--shadow-light), inset 3px 3px 7px var(--shadow-dark);
  --inset: inset 2px 2px 6px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light);
  --accent: #5B8DEF;
  --accent-soft: rgba(91, 141, 239, 0.16);
  --ok: #3FBF85;
  --warn: #E0B45C;
  --danger: #F06565;
  --line: rgba(231, 233, 237, 0.07);
  --scrim: rgba(0, 0, 0, 0.65);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  font-size: 13.5px; -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font-family: inherit; color: inherit; }
::selection { background: var(--accent-soft); }

/* scrollbar */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--shadow-dark); border-radius: 8px;
  border: 2px solid var(--bg);
}
html[data-theme="dark"] *::-webkit-scrollbar-thumb { background: #2c3038; }

/* ============ Layout ============ */
.app { display: flex; height: 100vh; }
.sidebar {
  width: 224px; flex: 0 0 auto; padding: 18px 14px; display: flex; flex-direction: column;
  gap: 6px; transition: width var(--dur); background: var(--bg);
}
.sidebar.collapsed { width: 76px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
.brand .logo {
  width: 38px; height: 38px; border-radius: 12px; flex: 0 0 auto;
  display: grid; place-items: center; box-shadow: var(--raised-sm); background: var(--surface);
  color: var(--accent);
}
.brand .bt { font-weight: 700; font-size: 13.5px; letter-spacing: .2px; white-space: nowrap; overflow: hidden; }
.brand .bs { font-size: 10.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; }
.sidebar.collapsed .bt, .sidebar.collapsed .bs { display: none; }

.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--text-2); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden;
  transition: box-shadow var(--dur), color var(--dur), background var(--dur);
  width: 100%; text-align: left;
}
.nav-item svg { flex: 0 0 17px; }
.nav-item:hover { color: var(--text); }
.nav-item.active {
  color: var(--accent); background: var(--surface); box-shadow: var(--raised-sm); font-weight: 600;
}
.sidebar.collapsed .nav-item { justify-content: center; padding: 11px 0; }
.sidebar.collapsed .nav-item .lbl { display: none; }
.nav-badge {
  margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--text-2);
  background: var(--surface); border-radius: 9px; padding: 2px 7px; box-shadow: var(--inset);
}
.sidebar.collapsed .nav-badge { display: none; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 6px; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.foot-row { display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  color: var(--text-2); background: var(--surface); box-shadow: var(--raised-sm);
  transition: all var(--dur); flex: 0 0 auto;
}
.icon-btn:hover { color: var(--text); }
a.icon-btn { text-decoration: none; color: var(--text-2); }
a.icon-btn:hover { color: var(--text); }
.icon-btn:active, .icon-btn.pressed { box-shadow: var(--pressed); }
.icon-btn.on { color: var(--accent); }
.sidebar.collapsed .foot-row { flex-direction: column; align-items: center; }

.main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 16px 22px 10px;
}
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
.topbar .device { font-size: 11.5px; color: var(--text-2); display: flex; gap: 5px; align-items: center; margin-top: 2px;}
.search-wrap {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border-radius: 12px; padding: 0 12px; height: 38px; width: 240px;
  box-shadow: var(--inset); color: var(--text-2);
}
.search-wrap input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 12.5px; color: var(--text); }
.scan-state { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.dot.scan { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1s infinite; }
.dot.off { background: var(--danger); box-shadow: 0 0 6px var(--danger); animation: none; }
@keyframes pulse { 50% { opacity: .35; } }
#offlineBanner {
  display: none; margin: 0 22px; padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--surface); color: var(--danger); font-size: 12.5px; box-shadow: var(--raised-sm);
  align-items: center; gap: 9px;
}
#offlineBanner.show { display: flex; }

.content { flex: 1; overflow-y: auto; padding: 10px 22px 26px; }

/* ============ Toolbar / filters ============ */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 0 14px; flex-wrap: wrap; }
.seg {
  display: flex; background: var(--surface); border-radius: 12px; padding: 4px; box-shadow: var(--inset); gap: 2px;
}
.seg button {
  padding: 6px 11px; border-radius: 9px; font-size: 12px; color: var(--text-2); display: flex; gap: 6px; align-items: center;
  transition: all var(--dur);
}
.seg button.on { color: var(--accent); box-shadow: var(--raised-sm); font-weight: 600; }
.select, .field input, .field select {
  height: 36px; border-radius: 11px; border: 0; background: var(--surface); box-shadow: var(--inset);
  padding: 0 12px; font-size: 12.5px; outline: none; color: var(--text); max-width: 200px;
}
.toolbar .spacer { flex: 1; }
.count-hint { font-size: 12px; color: var(--text-2); }

/* ============ Stat cards ============ */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 14px; padding-bottom: 20px; }
.stat {
  background: var(--surface); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--raised);
  display: flex; flex-direction: column; gap: 6px; transition: transform var(--dur);
}
.stat .k { font-size: 11.5px; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.stat .k svg { width: 14px; height: 14px; }
.stat .v { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.stat .hint { font-size: 10.5px; color: var(--text-2); }

/* ============ Service cards ============ */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 16px; }
.svc-card {
  background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--raised);
  display: flex; flex-direction: column; gap: 10px; transition: transform var(--dur), box-shadow var(--dur);
  position: relative;
}
@keyframes rise { from { opacity: 0; transform: translateY(5px); } }
.svc-card:hover { transform: translateY(-2px); }
.svc-card.selected { box-shadow: var(--pressed); }
.svc-card.menu-open { z-index: 50; }
.sc-head { display: flex; align-items: center; gap: 10px; }
.sc-icon {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--surface-2); box-shadow: var(--inset); color: var(--accent); flex: 0 0 auto;
}
.sc-icon.cat-non-web { color: var(--ok); }
.sc-icon.cat-unknown { color: var(--text-2); }
.sc-icon.cat-internet-web { color: var(--warn); }
.sc-title { min-width: 0; }
.sc-title .n { font-weight: 650; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-title .a { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); flex: 0 0 auto; }
.sc-addr {
  font-family: var(--mono); font-size: 11.5px; color: var(--text-2); background: var(--surface-2);
  border-radius: 9px; padding: 7px 10px; box-shadow: var(--inset);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sc-addr b { color: var(--text); font-weight: 600; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag {
  font-size: 10.5px; font-weight: 600; color: var(--text-2); border-radius: 7px; padding: 3px 8px;
  background: var(--surface-2); box-shadow: var(--raised-sm);
}
.tag.scope { color: var(--accent); }
.tag.scope.wild { color: var(--warn); }
.tag.conf-confirmed { color: var(--ok); }
.tag.conf-high { color: var(--ok); }
.tag.conf-low { color: var(--warn); }
.tag.perm { color: var(--danger); }
.sc-metrics { display: flex; gap: 16px; font-size: 11px; color: var(--text-2); align-items: center; }
.sc-metrics svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
.sc-metrics .m b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.sc-actions { display: flex; gap: 7px; margin-top: 2px; }
.sc-actions .icon-btn { width: 30px; height: 30px; border-radius: 9px; }
.sc-actions .icon-btn svg { width: 14px; height: 14px; }
.sc-actions .icon-btn[disabled] { opacity: .35; cursor: default; }
.menu-wrap { position: relative; margin-left: auto; }
.menu {
  position: absolute; right: 0; top: 34px; z-index: 40; min-width: 178px;
  background: var(--surface-2); border-radius: 12px; box-shadow: var(--raised); padding: 6px; display: none;
}
.menu.show { display: block; animation: rise 140ms ease-out; }
.menu button { display: flex; width: 100%; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; font-size: 12px; color: var(--text); text-align: left; }
.menu button:hover { background: var(--accent-soft); }
.menu button.danger { color: var(--danger); }
.menu button[disabled] { opacity: .4; pointer-events: none; }
.menu .sep { height: 1px; background: var(--line); margin: 5px 8px; }

/* ============ Table / list view ============ */
.tbl-wrap { background: var(--surface); border-radius: var(--radius); box-shadow: var(--raised); overflow: auto; max-height: calc(100vh - 240px); }
table.svc { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 780px; }
table.svc th {
  position: sticky; top: 0; background: var(--surface); z-index: 2; text-align: left;
  padding: 12px 14px; font-size: 11px; color: var(--text-2); font-weight: 600; letter-spacing: .3px;
  border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap;
}
table.svc th .arw { opacity: .4; font-size: 9px; }
table.svc th.sorted .arw { opacity: 1; color: var(--accent); }
table.svc td { padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.svc tr:last-child td { border-bottom: 0; }
table.svc tbody tr { cursor: pointer; transition: background var(--dur); }
table.svc tbody tr:hover { background: var(--accent-soft); }
table.svc tbody tr.selected { background: var(--accent-soft); box-shadow: var(--inset); }
table.svc .mono { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }
.tname { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.tname .ticon { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); box-shadow: var(--inset); flex: 0 0 auto; }
.tname .ticon svg { width: 14px; height: 14px; color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }

/* ============ Empty ============ */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 64px 20px; color: var(--text-2);
}
.empty .eicon { width: 62px; height: 62px; border-radius: 20px; display: grid; place-items: center; box-shadow: var(--inset); background: var(--surface); }
.empty .eicon svg { width: 26px; height: 26px; }
.empty .et { font-size: 13.5px; font-weight: 600; color: var(--text); }

/* ============ Detail panel ============ */
.scrim {
  position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--dur); z-index: 60;
  backdrop-filter: blur(1.5px);
}
.scrim.show { opacity: 1; pointer-events: auto; }
.detail {
  position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 94vw; z-index: 70;
  background: var(--bg); box-shadow: -12px 0 30px var(--shadow-dark);
  transform: translateX(102%); transition: transform 220ms cubic-bezier(.2,.7,.3,1);
  display: flex; flex-direction: column;
}
.detail.show { transform: none; }
.d-head { padding: 18px 20px 14px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.d-head .sc-icon { width: 44px; height: 44px; }
.d-head h2 { font-size: 15.5px; }
.d-head .sub { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }
.d-close { margin-left: auto; }
.d-body { overflow-y: auto; padding: 6px 20px 24px; flex: 1; }
.d-sec { padding: 14px 0; border-bottom: 1px solid var(--line); }
.d-sec:last-child { border-bottom: 0; }
.d-sec h3 { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--text-2); margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: 108px 1fr; gap: 5px 12px; font-size: 12px; }
.kv .k { color: var(--text-2); }
.kv .v { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
.kv .v.plain { font-family: var(--font); font-size: 12px; }
.ep-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
  background: var(--surface-2); box-shadow: var(--inset); margin-bottom: 7px; font-size: 11.5px; font-family: var(--mono);
}
.ep-row .scope-p { margin-left: auto; font-family: var(--font); }
.basis-item { font-size: 11.5px; color: var(--text-2); padding: 5px 0; display: flex; gap: 8px; }
.basis-item svg { width: 13px; height: 13px; flex: 0 0 auto; margin-top: 1px; color: var(--accent); }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chart { background: var(--surface-2); border-radius: 12px; padding: 10px; box-shadow: var(--inset); }
.chart .ct { font-size: 10.5px; color: var(--text-2); margin-bottom: 6px; display: flex; justify-content: space-between; }
.chart .ct b { color: var(--text); font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: 56px; display: block; }
.d-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  height: 34px; padding: 0 14px; border-radius: 11px; font-size: 12px; font-weight: 600;
  background: var(--surface); box-shadow: var(--raised-sm); color: var(--text);
  display: inline-flex; align-items: center; gap: 7px; transition: all var(--dur);
}
.btn:hover { color: var(--accent); }
.btn:active { box-shadow: var(--pressed); }
.btn svg { width: 13px; height: 13px; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: var(--raised-sm); }
.btn.primary:hover { color: #fff; filter: brightness(1.05); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { color: var(--danger); background: var(--surface); }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ============ Modal ============ */
.modal {
  position: fixed; inset: 0; z-index: 80; display: none; place-items: center; padding: 20px;
}
.modal.show { display: grid; }
.modal .box {
  width: 400px; max-width: 100%; background: var(--bg); border-radius: 20px; box-shadow: var(--raised), 0 20px 50px var(--shadow-dark);
  padding: 22px; animation: rise 160ms ease-out;
}
.modal h3 { font-size: 15px; margin-bottom: 8px; }
.modal .mwarn { font-size: 12.5px; color: var(--text-2); line-height: 1.55; }
.modal .mpid { margin: 12px 0; padding: 11px 13px; border-radius: 12px; background: var(--surface); box-shadow: var(--inset); font-family: var(--mono); font-size: 12px; }
.modal .mrow { display: flex; gap: 9px; justify-content: flex-end; margin-top: 16px; }
.modal .rel { margin-top: 8px; font-size: 11.5px; color: var(--warn); }

/* ============ Toast ============ */
.toast {
  position: fixed; bottom: 26px; left: 50%; transform: translate(-50%, 20px); z-index: 90;
  background: var(--surface); box-shadow: var(--raised); border-radius: 13px; padding: 11px 18px;
  font-size: 12.5px; display: flex; gap: 9px; align-items: center; opacity: 0; pointer-events: none;
  transition: all 200ms ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast svg { width: 15px; height: 15px; color: var(--ok); }
.toast.err svg { color: var(--danger); }

/* ============ History ============ */
.hist-filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-bottom: 14px; }
table.hist { width: 100%; border-collapse: collapse; font-size: 12px; }
table.hist th { text-align: left; padding: 10px 12px; color: var(--text-2); font-size: 11px; border-bottom: 1px solid var(--line); }
table.hist td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.hist .time { font-family: var(--mono); font-size: 11px; color: var(--text-2); white-space: nowrap; }
.ev { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 11px; border-radius: 7px; padding: 3px 8px; background: var(--surface-2); box-shadow: var(--raised-sm); white-space: nowrap;}
.ev.appeared, .ev.first_seen { color: var(--ok); }
.ev.disappeared, .ev.stopped { color: var(--danger); }
.ev.endpoint_change, .ev.classification_change { color: var(--warn); }
.detail-cell { font-family: var(--mono); font-size: 10.5px; color: var(--text-2); word-break: break-all; max-width: 340px; }

/* ============ Settings ============ */
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; align-items: start; }
.set-group { background: var(--surface); border-radius: var(--radius); box-shadow: var(--raised); padding: 18px; }
.set-group h3 { font-size: 12.5px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.set-group h3 svg { width: 15px; height: 15px; color: var(--accent); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field .fl { font-size: 12.5px; }
.field .fhint { font-size: 10.5px; color: var(--text-2); margin-top: 2px; max-width: 340px; }
.field .fh { font-size: 10.5px; color: var(--text-2); margin-top: 2px; }
.switch {
  width: 46px; height: 26px; border-radius: 14px; background: var(--surface-2); box-shadow: var(--inset);
  position: relative; flex: 0 0 auto; transition: all var(--dur);
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--surface); box-shadow: var(--raised-sm); transition: all var(--dur);
}
.switch.on { background: var(--accent); box-shadow: var(--inset); }
.switch.on::after { left: 23px; }
.set-note { font-size: 11px; color: var(--text-2); line-height: 1.6; padding: 10px 12px; border-radius: 11px; background: var(--surface-2); box-shadow: var(--inset); }
.errlog { font-family: var(--mono); font-size: 10.5px; color: var(--text-2); background: var(--surface-2); box-shadow: var(--inset); border-radius: 11px; padding: 10px; max-height: 180px; overflow-y: auto; white-space: pre-wrap; }

/* tooltip */
[data-tip] { position: relative; }
[data-tip]:hover::after {

/* ================= API ================= */
async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ "X-CSRF-Token": CSRF }, opts.headers || {});
  if (opts.body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch(path, { method: opts.method || "GET", headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  if (r.status === 403) { throw new Error("forbidden"); }
  if (!r.ok && r.status !== 400) throw new Error("http " + r.status);
  return r.json();
}
async function refreshData(manual) {
  try {
    const d = await api("/api/scan", { method: "POST" });
    services = d.services || []; status = d.status || status; online = true;
    setOffline(false);
    renderCurrent();
  } catch (e) {
    online = false; setOffline(true);
    if (manual) toast(t("offline"), true);
  }
}
function setOffline(off) {
  document.getElementById("offlineBanner").classList.toggle("show", off);
  document.getElementById("offlineText").textContent = t("offline") + " ";
  const dot = document.getElementById("scanDot");
  dot.classList.toggle("off", off);
}

/* ================= Formatting ================= */
function fmtTime(ts) {
  if (!ts) return "—";
  return new Intl.DateTimeFormat(prefs.lang === "zh" ? "zh-CN" : "en-US",
    { hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date(ts * 1000));
}
function fmtClock(ts) {
  if (!ts) return "—";
  return new Intl.DateTimeFormat(prefs.lang === "zh" ? "zh-CN" : "en-US",
    { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date(ts * 1000));
}
function fmtDur(sec) {
  if (sec == null || !isFinite(sec) || sec < 0) return "—";
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return prefs.lang === "zh" ? d + "天 " + h + "小时" : d + "d " + h + "h";
  if (h) return prefs.lang === "zh" ? h + "小时 " + m + "分" : h + "h " + m + "m";
  return prefs.lang === "zh" ? m + "分钟" : m + "m";
}
function fmtPct(v) { return v == null ? "—" : (Math.round(v * 10) / 10) + "%"; }
function fmtMb(v) { return v == null ? "—" : (v >= 1024 ? (v / 1024).toFixed(1) + " GB" : Math.round(v) + " MB"); }
function svcName(s) {
  if (s.detected_service && s.detected_service !== "HTTP") return s.detected_service;
  if (s.app_name) return s.app_name;
  if (s.identify && s.identify.app) return s.identify.app;
  if (s.proc_name) return s.proc_name;
  return t("unknown.svc");
}
function primaryWeb(s, forOpen) {
  if (!s.app_layer || ["http", "https", "websocket"].indexOf(s.app_layer) < 0) return null;
  if (forOpen && !s.browser_openable) return null;  // JSON API / WS endpoint: not a page
  const scheme = s.app_layer === "https" || s.app_layer === "websocket" ? "https" : "http";
  const eps = s.endpoints.filter(e => e.proto === "tcp");
  let ip = "127.0.0.1";
  const lb = eps.find(e => e.ip === "127.0.0.1" || e.ip === "::1");
  const lan = eps.find(e => e.scope === "lan");
  if (!lb) { if (lan) ip = lan.ip; else if (eps.length && eps[0].scope !== "wildcard") ip = eps[0].ip; }
  if (ip === "0.0.0.0" || ip === "*" || ip === "::") ip = "127.0.0.1";
  const port = (lb || lan || eps[0] || {}).port || s.ports[0];
  if (!port) return null;
  return scheme + "://" + ip + ":" + port;
}

/* ================= Sorting / filtering ================= */
function sortVal(s, k) {
  switch (k) {
    case "name": return svcName(s).toLowerCase();
    case "port": return s.ports.length ? s.ports[0] : 99999;
    case "cpu": return s.cpu_percent == null ? -1 : s.cpu_percent;
    case "mem": return s.memory_mb == null ? -1 : s.memory_mb;
    case "started": return s.started_ts || 0;
  }
  return 0;
}
function filteredList(catFilter) {
  let list = services.slice();
  if (catFilter) list = list.filter(s => s.category === catFilter);
  if (prefs.tagFilter) list = list.filter(s => (s.tags || []).indexOf(prefs.tagFilter) >= 0);
  const q = search.trim().toLowerCase();
  if (q) list = list.filter(s => {
    const hay = [svcName(s), s.proc_name, s.app_name, s.exe, String(s.pid),
      (s.ports || []).join(" "), (s.protocols || []).join(" "),
      (s.tags || []).map(x => x + " " + tagLabel(x)).join(" "),
      s.app_layer || "", s.category || "", (s.endpoints || []).map(e => e.ip).join(" ")].join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  list.sort((a, b) => {
    const va = sortVal(a, prefs.sortKey), vb = sortVal(b, prefs.sortKey);
    return (va < vb ? -1 : va > vb ? 1 : 0) * prefs.sortDir;
  });
  return list;
}

function scopeTagsOf(s) {
  const out = [];
  const sc = s.scopes || {};
  if (sc.public_verified) out.push(`<span class="tag scope">${esc(t("scope.public_verified"))}</span>`);
  else if (sc.public_condition) out.push(`<span class="tag scope wild">${esc(t("scope.public_condition"))}</span>`);
  if (sc.loopback) out.push(`<span class="tag scope">${esc(t("scope.loopback"))}</span>`);
  if (sc.lan) out.push(`<span class="tag scope">${esc(t("scope.lan"))}</span>`);
  if (sc.wildcard && !sc.lan && !sc.loopback) out.push(`<span class="tag scope wild">${esc(t("scope.wildcard"))}</span>`);
  if (s.permission === "denied") out.push('<span class="tag perm">' + esc(t("st.denied")) + "</span>");
  return out.join("");
}

/* ================= Flicker-free rendering ================= */
function svcSig(s) {
  const sc = s.scopes || {};
  return [s.id, s.category, (s.tags || []).join(","), (s.ports || []).join(","),
    s.confidence, s.app_layer || "", s.proc_name || "", s.app_name || "",
    s.detected_service || "", s.permission, (s.basis || []).length,
    s.passive_probe ? 1 : 0, s.reachable === true ? 1 : 0,
    sc.loopback ? 1 : 0, sc.lan ? 1 : 0, sc.wildcard ? 1 : 0,
    sc.public_condition ? 1 : 0, sc.public_verified ? 1 : 0,
    (s.endpoints || []).length, s.started_ts || 0].join("~");
}
function listSig(list) {
  return [prefs.page, prefs.view, prefs.tagFilter, prefs.sortKey, prefs.sortDir,
    prefs.lang,
    search, settingsCache && settingsCache.show_confidence === false ? 0 : 1,
    list.map(svcSig).join("|")].join("#");
}
function updateMetrics() {
  document.querySelectorAll("[data-m]").forEach(el => {
    const raw = el.dataset.m, i = raw.indexOf("-");
    const kind = raw.slice(0, i), id = raw.slice(i + 1);
    const s = services.find(x => x.id === id);
    if (!s) return;
    el.textContent = kind === "cpu" ? fmtPct(s.cpu_percent) : fmtMb(s.memory_mb);
  });
}
function paintList(el, list, pre) {
  const sig = listSig(list);
  if (sig === el._sig && el.querySelector(".svc-card, .tbl-wrap")) {
    updateMetrics(); return;
  }
  el._sig = sig;
  el.innerHTML = (pre || "") + toolbarHTML(true) + (list.length
    ? (prefs.view === "card" ? `<div class="grid">${list.map(cardHTML).join("")}</div>` : tableHTML(list))
    : emptyHTML());

  if (hint) hint.textContent = list.length + " " + t("count.services");
}

        <div class="k">${esc(t("f.cmd"))}</div><div class="v">${esc(s.cmdline || (s.permission === "denied" ? t("perm.denied") : "—"))}</div>
        <div class="k">${esc(t("f.started"))}</div><div class="v plain">${s.started_ts ? esc(fmtTime(s.started_ts)) : "—"}</div>
        <div class="k">${esc(t("f.first_seen"))}</div><div class="v plain">${esc(fmtTime(s.first_seen_ts))}</div>
        <div class="k">${esc(t("f.runtime"))}</div><div class="v plain">${esc(fmtDur(s.started_ts ? Date.now() / 1000 - s.started_ts : null))}</div>
      </div></div>
      <div class="d-sec"><h3>${esc(t("d.network"))}</h3>
        ${eps}
        <div class="kv" style="margin-top:10px">
          <div class="k">${esc(t("f.protocol"))}</div><div class="v plain">${esc((s.app_layer || "—").toUpperCase())}${s.detected_service ? " · " + esc(s.detected_service) : ""}</div>
          <div class="k">${esc(t("f.url"))}</div><div class="v">${url ? esc(url) : "—"}</div>
          <div class="k">${esc(t("f.scope"))}</div><div class="v plain">${scopeTagsOf(s).replace(/class="tag[^"]*"/g, 'class="tag"')}</div>
          <div class="k">${esc(t("f.connectivity"))}</div><div class="v plain">${s.probed ? (s.reachable ? esc(t("f.reachable")) : esc(t("f.unreachable"))) : esc(t("f.not_probed"))}${status && status.scanning ? " · " + esc(t("scan.running")) : ""}</div>
        </div></div>
      <div class="d-sec"><h3>${esc(t("d.resource"))}</h3>
        <div class="kv"><div class="k">${esc(t("cpu"))}</div><div class="v plain" id="dCpu">${esc(fmtPct(s.cpu_percent))}</div>
        <div class="k">${esc(t("mem"))}</div><div class="v plain" id="dMem">${esc(fmtMb(s.memory_mb))}</div></div>
        <div class="charts" style="margin-top:10px">
          <div class="chart"><div class="ct">${esc(t("cpu_hist"))}<b id="cpuPeak"></b></div><div id="cpuChart" class="no_data">${esc(t("no_data"))}</div></div>
          <div class="chart"><div class="ct">${esc(t("mem_hist"))}<b id="memPeak"></b></div><div id="memChart" class="no_data" style="font-size:10.5px;color:var(--text-2)">${esc(t("no_data"))}</div></div>
        </div></div>
      ${showConf ? `<div class="d-sec"><h3>${esc(t("d.ident"))}</h3><div class="kv">
        <div class="k">${esc(t("f.type"))}</div><div class="v plain">${esc(s.service_type ? typeLabel(s.service_type) : t("unknown.svc"))}</div>
        <div class="k">${esc(t("f.tags"))}</div><div class="v plain">${(s.tags || []).map(x => `<span class="tag">${esc(tagLabel(x))}</span>`).join(" ")}</div>
        <div class="k">${esc(t("f.confidence"))}</div><div class="v plain"><span class="tag conf-${esc(s.confidence)}">${esc(t("conf." + s.confidence))}</span></div>
        </div><h3 style="margin-top:12px">${esc(t("f.basis"))}</h3>${basis || `<div class="basis-item">${esc(t("conf.unknown"))}</div>`}</div>` : ""}
      <div class="d-sec"><h3>${esc(t("d.actions"))}</h3><div class="d-actions">
        <button class="btn primary" data-act="open" data-id="${esc(s.id)}" ${primaryWeb(s, true) ? "" : "disabled"}><svg><use href="#i-open"/></svg>${esc(t("open"))}</button>
        <button class="btn" data-act="copyurl" data-id="${esc(s.id)}"><svg><use href="#i-copy"/></svg>${esc(t("act.copy_url"))}</button>
        <button class="btn" data-act="copyip" data-id="${esc(s.id)}">${esc(t("act.copy_ip"))}</button>
        <button class="btn" data-act="copyport" data-id="${esc(s.id)}">${esc(t("act.copy_port"))}</button>
        <button class="btn" data-act="copypid" data-id="${esc(s.id)}">${esc(t("act.copy_pid"))}</button>
        <button class="btn" data-act="copypath" data-id="${esc(s.id)}">${esc(t("act.copy_path"))}</button>
        <button class="btn" data-act="copycmd" data-id="${esc(s.id)}">${esc(t("act.copy_cmd"))}</button>
        <button class="btn" data-act="reprobe" data-id="${esc(s.id)}"><svg><use href="#i-probe"/></svg>${esc(t("act.reprobe"))}</button>
        <button class="btn danger" data-act="stop" data-id="${esc(s.id)}"><svg><use href="#i-power"/></svg>${esc(t("act.stop"))}</button>
      </div></div>
    </div>`;
}
function openDetail(id) {
  const s = services.find(x => x.id === id);
  if (!s) return;
  selectedId = id;
  detailSig = "";
  const d = document.getElementById("detail");
  d.innerHTML = detailHTML(s);
  d.classList.add("show"); document.getElementById("scrim").classList.add("show");
  markSelected();
  loadCharts(id);
  clearInterval(detailTimer);
  detailTimer = setInterval(() => {
    if (!selectedId) return;
    const cur = services.find(x => x.id === selectedId);
    if (!cur) return;
    if (svcSig(cur) !== detailSig) {
      // structural change (classification, endpoints…): rebuild panel
      document.getElementById("detail").innerHTML = detailHTML(cur);
      detailSig = svcSig(cur);
    } else {
      const e1 = document.getElementById("dCpu"), e2 = document.getElementById("dMem");
      if (e1) e1.textContent = fmtPct(cur.cpu_percent);
      if (e2) e2.textContent = fmtMb(cur.memory_mb);
    }
    loadCharts(selectedId);
  }, 4000);
}
function closeDetail() {
  selectedId = null;
  document.getElementById("detail").classList.remove("show");
  document.getElementById("scrim").classList.remove("show");
  clearInterval(detailTimer);
  markSelected();
}
function loadCharts(id) {
  api("/api/resources?id=" + encodeURIComponent(id)).then(d => {
    const pts = d.points || [];
    drawChart("cpuChart", "cpuPeak", pts.map(p => [p.ts, p.cpu]), v => v == null ? null : v.toFixed(0) + "%");
    drawChart("memChart", "memPeak", pts.map(p => [p.ts, p.mem]), v => fmtMb(v));
  }).catch(() => {});
}
function drawChart(elId, peakId, pairs, fmtV) {
  const el = document.getElementById(elId);
  if (!el) return;
  const vals = pairs.map(p => p[1]).filter(v => v != null);
  if (!vals.length) { el.innerHTML = t("no_data"); el.className = "no_data"; return; }
  el.className = "";
  const W = 170, H = 56, n = pairs.length;
  const max = Math.max.apply(null, vals), min = 0;
  const xs = i => (n === 1 ? W / 2 : i / (n - 1) * (W - 6) + 3);
  const ys = v => v == null ? H - 4 : H - 6 - ((v - min) / (max - min || 1)) * (H - 12);
  const path = pairs.map((p, i) => (i === 0 ? "M" : "L") + xs(i).toFixed(1) + " " + ys(p[1]).toFixed(1)).join(" ");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${path} L ${xs(n - 1).toFixed(1)} ${H} L ${xs(0).toFixed(1)} ${H} Z" fill="var(--accent)" opacity="0.10"></path>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"></path></svg>`;
  const peak = document.getElementById(peakId);
  if (peak) peak.textContent = fmtV(max);
}

/* ================= Actions ================= */
function byId(id) { return services.find(x => x.id === id); }
function doCopy(text) {
  if (text == null) return toast(t("copy.fail"), true);
  const done = () => toast(t("copy.ok"));
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(String(text)).then(done).catch(() => fallback());
  } else fallback();
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = String(text); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast(t("copy.fail"), true); }
    document.body.removeChild(ta);
  }
}
const STOP_ERRORS = {
  self_stop_forbidden: "stop.self", denied: "stop.denied", identity_mismatch: "stop.mismatch",
  protected_system_process: "stop.protected", not_found: "stop.notfound",
  psutil_unavailable: "perm.unavailable", failed: "stop.denied",
};
let pendingStopPid = null;
function openStopModal(id) {
  const s = byId(id);
  if (!s) return;
  pendingStopPid = s;
  document.getElementById("stopTitle").textContent = t("stop.title");
  document.getElementById("stopMsg").textContent = t("stop.msg");
  document.getElementById("stopProc").textContent = `${t("stop.proc")}: ${s.proc_name || s.app_name || svcName(s)} · PID ${s.pid}`;
  const ports = (s.ports || []).join(", ");
  const others = services.filter(x => x.pid === s.pid && x.id !== s.id);
  document.getElementById("stopRel").textContent = t("stop.rel") + (ports || "—") + (others.length ? ` (+${others.length} ${t("count.services")})` : "");
  document.getElementById("stopConfirm").textContent = t("stop.confirm");
  document.getElementById("stopCancel").textContent = t("cancel");
  document.getElementById("stopModal").classList.add("show");
}
async function confirmStop() {
  const s = pendingStopPid;
  document.getElementById("stopModal").classList.remove("show");
  if (!s) return;
  try {
    const d = await api("/api/stop", { method: "POST", body: { pid: s.pid, name: s.proc_name, create_time: s.started_ts } });
    if (d.ok) toast(t("stop.ok"));
    else toast(t(STOP_ERRORS[d.error] || "stop.denied"), true);
  } catch (e) { toast(t("offline"), true); }
  pendingStopPid = null;
  setTimeout(refreshData, 700);
}
async function reprobe(id) {
  try {
    await api("/api/reprobe", { method: "POST", body: { id: id } });
    toast(t("act.reprobe") + "…");
    setTimeout(refreshData, 1500);
    setTimeout(refreshData, 4500);
  } catch (e) { toast(t("offline"), true); }
}
function toast(msg, err) {
  const el = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  el.classList.toggle("err", !!err);
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2300);
}

/* ================= Global click routing ================= */
document.addEventListener("click", e => {
  const actBtn = e.target.closest("[data-act]");
  if (actBtn) {
    const act = actBtn.dataset.act, id = actBtn.dataset.id, s = byId(id);
    if (!s && ["closedetail"].indexOf(act) < 0) return;
    switch (act) {
      case "open": {
        const url = primaryWeb(s, true);
        if (url) window.open(url, "_blank"); else toast(t("open.notweb"), true);
        break; }
      case "copyurl": doCopy(primaryWeb(s)); break;
      case "copyip": doCopy((s.endpoints.find(ep => ep.ip !== "*" && ep.ip) || {}).ip); break;
      case "copyport": doCopy(s.ports.join(", ")); break;
      case "copypid": doCopy(s.pid); break;
      case "copypath": doCopy(s.exe); break;
      case "copycmd": doCopy(s.cmdline); break;
      case "detail": openDetail(id); break;
      case "closedetail": closeDetail(); break;
      case "reprobe": reprobe(id); break;
      case "stop": openStopModal(id); break;
      case "viewhist": histFilter.q = s.proc_name || svcName(s); setPage("history"); break;
      case "menu": {
        document.querySelectorAll(".menu.show").forEach(m => { if (m.id !== "menu-" + id) m.classList.remove("show"); });
        document.querySelectorAll(".svc-card.menu-open").forEach(c => c.classList.remove("menu-open"));
        const m = document.getElementById("menu-" + id);
        if (m) {
          m.classList.toggle("show");
          if (m.classList.contains("show")) m.closest(".svc-card").classList.add("menu-open");
        }
        break; }
    }
    return;
  }
  if (!e.target.closest(".menu")) document.querySelectorAll(".menu.show").forEach(m => m.classList.remove("show"));
  if (!e.target.closest(".svc-card.menu-open")) document.querySelectorAll(".svc-card.menu-open").forEach(c => c.classList.remove("menu-open"));
  const nav = e.target.closest("[data-nav]");
  if (nav) { setPage(nav.dataset.nav); return; }
  const viewBtn = e.target.closest("[data-view]");
  if (viewBtn) { prefs.view = viewBtn.dataset.view; savePrefs(); renderCurrent(); return; }
  const sortH = e.target.closest("[data-sort]");
  if (sortH) {
    const k = sortH.dataset.sort;
    const map = { pid: null, port: "port", proto: null, scope: null, cpu: "cpu", mem: "mem", started: "started", name: "name" };
    if (map[k] == null && k !== "name") { /* column not sortable */ }
    else if (k === "name") { toggleSort("name"); }
    else toggleSort(k);
    return;
  }
  const row = e.target.closest("tr[data-id]");
  if (row) { openDetail(row.dataset.id); return; }
  const sw = e.target.closest(".switch[data-setting]");
  if (sw && sw.dataset.setting === "show_confidence_local") {
    prefs.show_confidence = !(prefs.show_confidence !== false); savePrefs();
    sw.classList.toggle("on"); renderCurrent(); return;
  }
  if (sw && settingsCache) {
    const k = sw.dataset.setting;
    const nv = !settingsCache[k];
    sw.classList.toggle("on", nv);
    saveServerSettings({ [k]: nv });
    return;
  }
  if (e.target.id === "scrim") { closeDetail(); return; }
  if (e.target.id === "stopCancel") document.getElementById("stopModal").classList.remove("show");
  if (e.target.id === "stopConfirm") confirmStop();
  if (e.target.id === "histClear" || e.target.id === "setClearHist") {
    document.getElementById("clearTitle").textContent = t("hist.clear");
    document.getElementById("clearMsg").textContent = t("hist.clear.confirm");
    document.getElementById("clearConfirm").textContent = t("hist.clear");
    document.getElementById("clearCancel").textContent = t("cancel");
    document.getElementById("clearModal").classList.add("show"); return;
  }
  if (e.target.id === "clearCancel") document.getElementById("clearModal").classList.remove("show");
  if (e.target.id === "clearConfirm") {
    document.getElementById("clearModal").classList.remove("show");
    api("/api/history/clear", { method: "POST", body: {} }).then(() => { toast(t("copy.ok")); loadHistory(); }).catch(() => toast(t("offline"), true));
    return; }
  if (e.target.id === "btnRefresh") refreshData(true);
});
function toggleSort(k) {
  if (prefs.sortKey === k) prefs.sortDir = -prefs.sortDir;
  else { prefs.sortKey = k; prefs.sortDir = 1; }
  savePrefs(); renderCurrent();
}
document.addEventListener("change", e => {
  if (e.target.id === "tagFilter") { prefs.tagFilter = e.target.value; savePrefs(); renderCurrent(); }
  if (e.target.id === "sortSel") { toggleSort(e.target.value === prefs.sortKey ? prefs.sortKey : e.target.value); }
  if (e.target.id === "setLang") { prefs.lang = e.target.value; savePrefs(); applyLang(); }
  if (e.target.id === "setTheme") { prefs.theme = e.target.value; savePrefs(); applyTheme(); }
  if (e.target.id === "setView") { prefs.view = e.target.value; savePrefs(); renderCurrent(); }
  if (e.target.id === "setRefresh") { prefs.refreshInterval = parseInt(e.target.value, 10); savePrefs(); applyRefresh(); }
  if (e.target.id === "histDays") { histFilter.days = parseInt(e.target.value, 10) || 0; loadHistory(); }
  if (e.target.id === "histType") { histFilter.type = e.target.value; loadHistory(); }
  const numEl = e.target.closest("[data-setting-num]");
  if (numEl) saveServerSettings({ [numEl.dataset.settingNum]: parseInt(numEl.value, 10) || 0 });
  const strEl = e.target.closest("[data-setting-str]");
  if (strEl) saveServerSettings({ [strEl.dataset.settingStr]: strEl.value });
  const selEl = e.target.closest("[data-setting-sel]");
  if (selEl) saveServerSettings({ [selEl.dataset.settingSel]: selEl.value });
});
document.addEventListener("input", e => {
  if (e.target.id === "searchInput") { search = e.target.value; if (["dashboard", "internet", "lan", "local", "nonweb", "unknown"].indexOf(prefs.page) >= 0) renderCurrent(); }
  if (e.target.id === "histQ") { histFilter.q = e.target.value; clearTimeout(window._hq); window._hq = setTimeout(renderHistoryPage, 250); }
});

/* ================= Render dispatch ================= */
function renderCurrent() {
  renderNav(); renderTopbar();
  switch (prefs.page) {
    case "dashboard": renderDashboard(); break;
    case "internet": renderServicePage("internet-web"); break;
    case "lan": renderServicePage("lan-web"); break;
    case "local": renderServicePage("local-web"); break;
    case "nonweb": renderServicePage("non-web"); break;
    case "unknown": renderServicePage("unknown"); break;
    case "history": renderHistoryPage(); break;
    case "settings": renderSettingsPage(); break;
  }
  if (selectedId && document.getElementById("detail").classList.contains("show")) {
    const s = byId(selectedId);
    if (s && svcSig(s) !== detailSig) {
      document.getElementById("detail").innerHTML = detailHTML(s);
      detailSig = svcSig(s);
    }
  }
}
function renderAll() { renderCurrent(); }
function markSelected() {
  document.querySelectorAll(".svc-card,.tbl-wrap tr[data-id]").forEach(el =>
    el.classList.toggle("selected", el.dataset.id === selectedId));
}
function renderTopbar() {
  document.getElementById("pageTitle").textContent = t("page." + prefs.page);
  document.getElementById("brandSub").textContent = t("sub.monitoring");
  document.getElementById("deviceName").textContent = status ? status.device_name : "—";
  document.getElementById("searchInput").placeholder = t("search.ph");
  const dot = document.getElementById("scanDot"), txt = document.getElementById("scanText");
  if (!online) { txt.textContent = t("offline").split("。")[0].split(".")[0]; dot.className = "dot off"; }
  else if (status && status.scanning) { txt.textContent = t("scan.running"); dot.className = "dot scan"; }
  else if (status && status.last_scan_ts) { txt.textContent = `${t("scan.last")} ${fmtClock(status.last_scan_ts)} (${status.last_scan_ms} ms)`; dot.className = "dot"; }
  else { txt.textContent = t("scan.never"); dot.className = "dot"; }
  document.getElementById("btnRefresh").setAttribute("data-tip", t("scan.last"));
}

/* ================= Theme / lang ================= */
function applyTheme() {
  document.documentElement.dataset.theme = prefs.theme;
  document.getElementById("btnTheme").innerHTML = `<svg width="17" height="17"><use href="#${prefs.theme === "dark" ? "i-sun" : "i-moon"}"/></svg>`;
  document.getElementById("btnTheme").dataset.tip = prefs.theme === "dark" ? t("set.theme.light") : t("set.theme.dark");
}
function applyLang() {
  document.documentElement.lang = prefs.lang === "zh" ? "zh-CN" : "en";
  detailSig = "";   // force detail panel rebuild with new tag labels
  applyTheme(); renderAll();
  if (prefs.page === "history") loadHistory();
}
document.getElementById("btnTheme").addEventListener("click", () => {
  prefs.theme = prefs.theme === "dark" ? "light" : "dark"; savePrefs(); applyTheme();
});
document.getElementById("btnLang").addEventListener("click", () => {
  prefs.lang = prefs.lang === "zh" ? "en" : "zh"; savePrefs(); applyLang();
});
document.getElementById("btnCollapse").addEventListener("click", () => {
  prefs.navCollapsed = !prefs.navCollapsed; savePrefs();
  document.getElementById("sidebar").classList.toggle("collapsed", prefs.navCollapsed);
  renderNav();
});

/* ================= Scheduler ================= */
function applyRefresh() {
  clearInterval(refreshTimer);
  if (prefs.refreshInterval > 0) refreshTimer = setInterval(() => refreshData(false), prefs.refreshInterval * 1000);
}

/* ================= Boot ================= */
document.getElementById("sidebar").classList.toggle("collapsed", prefs.navCollapsed);
applyTheme();
if (CSRF === "") {
  document.getElementById("content").innerHTML = `<div class="empty"><div class="eicon"><svg width="24" height="24"><use href="#i-warn"/></svg></div><div class="et">Local Service Monitor</div><div>Open via <code style="font-family:var(--mono)">http://127.0.0.1:8848/</code> started by server.py</div></div>`;
} else {
  applyRefresh();
  refreshData(false);
  // light periodic UI clock update even when data unchanged
  setInterval(renderTopbar, 1000);
}
</script>
</body>
